  - Gemfile.lock
  - README.md
  - README_zh_Hans.md
  - README_zh_Hant.md
  - README_de.md
  - LICENSE
  - minimal-light.gemspec
  - html_source_file/
  - scripts/
  - docs/
  - main.tex
  - vendor/
  - .bundle/

# Public project pages are discovered through the sitemap, not homepage navigation.
collections:
  projects:
    output: true

plugins:
  - jekyll-remote-theme
